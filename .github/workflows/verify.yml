name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev --group security
      # semgrep en entorno aislado: incompatible con google-adk (opentelemetry).
      - run: uv tool install semgrep
      - run: uv run pytest -q
      - run: uv run ruff check campusflow tests factory_app factory_ui scripts
      - run: uv run python scripts/verify_repo.py
      # Gates de seguridad deterministas (SAST/SCA/secrets) — HIGH bloquea el pipeline.
      - name: Security scanners (semgrep + pip-audit + detect-secrets)
        run: >
          uv run python -c "from pathlib import Path;
          from factory_app.scanners import run_security_scans;
          r = run_security_scans(Path('.'));
          print('high:', r['high'], '| degraded scanners:', r['degraded_scanners']);
          raise SystemExit(1 if r['blocked'] else 0)"
      - name: Secret committed check
        run: "! git ls-files | grep -qx .env"

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
