[project]
name = "campusflow-agentic-factory"
version = "0.1.0"
description = "CampusFlow product plus Google ADK Agentic Software Factory starter"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=2.12.0,<3.0.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.8",
  "anthropic>=0.78",
  "litellm>=1.109,<1.112",
  "httpx>=0.27",
  "mcp>=1.24,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "httpx>=0.27",
]
# semgrep NO va aqui: fija opentelemetry<1.38 y choca con google-adk>=2.12
# (opentelemetry>=1.39). Se instala aislado: `uv tool install semgrep`.
security = [
  "pip-audit>=2.7",
  "detect-secrets>=1.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
